<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>VibePlanner</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <!-- Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS do projeto -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =====================================================
        LOGIN
  ====================================================== -->

  <div id="loginScreen" class="login-wrapper">

    <div class="login-card">

      <div class="login-header text-center mb-4">

        <div class="login-icon-wrap mb-3 d-inline-flex align-items-center justify-content-center" style="width: 56px; height: 56px; background: rgba(99, 102, 241, 0.1); color: var(--accent); border-radius: 16px; font-size: 24px;">
          <i class="bi bi-heart-fill"></i>
        </div>

        <h1 class="fw-bold fs-3 mb-1">
          VibePlanner
        </h1>

        <p class="text-muted small m-0">
          Seu cantinho de organização com estilo ✨
        </p>

      </div>

      <form id="loginForm">

        <div class="mb-3">

          <label class="form-label">
            Usuário
          </label>

          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0" style="border-top-left-radius: 10px; border-bottom-left-radius: 10px; border-color: var(--line);">
              <i class="bi bi-person text-muted"></i>
            </span>
            <input
              type="text"
              id="loginUser"
              class="form-control border-start-0 ps-0"
              placeholder="Digite seu nome"
              required
            >
          </div>

        </div>

        <div class="mb-3">

          <label class="form-label">
            Senha
          </label>

          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0" style="border-top-left-radius: 10px; border-bottom-left-radius: 10px; border-color: var(--line);">
              <i class="bi bi-shield-lock text-muted"></i>
            </span>
            <input
              type="password"
              id="loginPass"
              class="form-control border-start-0 ps-0"
              placeholder="Sua senha secreta"
              required
            >
          </div>

        </div>

        <p
          id="loginError"
          class="login-error"
          hidden
        ></p>

        <button
          type="submit"
          class="btn btn-primary w-100 py-2.5 fw-semibold mt-2"
        >
          Entrar na Agenda
        </button>

      </form>

    </div>

  </div>


  <!-- =====================================================
        APLICAÇÃO
  ====================================================== -->

  <div
    class="app d-none"
    id="appContent"
  >

    <!-- SIDEBAR -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="brand">
        <h1>VibePlanner</h1>
        <span>Organize seu tempo, conquiste planos</span>
      </div>


      <!-- MENU -->

      <nav class="side-nav">

        <button
          class="nav-btn active"
          data-view="agenda"
          type="button"
        >
          <i class="bi bi-calendar-week"></i>
          Agenda
        </button>

        <button
          class="nav-btn"
          data-view="hoje"
          type="button"
        >
          <i class="bi bi-house"></i>
          Hoje
        </button>

        <button
          class="nav-btn"
          data-view="tarefas"
          type="button"
        >
          <i class="bi bi-check2-square"></i>
          Tarefas
        </button>

        <button
          class="nav-btn"
          data-view="config"
          type="button"
        >
          <i class="bi bi-gear"></i>
          Configurações
        </button>

      </nav>


      <!-- TEMAS RÁPIDOS -->

      <div class="themes-quick mt-auto pt-3 border-top" style="border-color: var(--line) !important;">

        <div class="d-flex align-items-center justify-content-between mb-2 px-1">
          <span style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted);">Cores rápidas</span>
        </div>

        <div
          class="swatches d-flex gap-2"
          id="quickSwatches"
        ></div>

      </div>

    </aside>


    <!-- =================================================
         ÁREA PRINCIPAL
    ================================================== -->

    <div class="workspace">

      <!-- TOPBAR -->

      <header class="topbar">

        <button
          class="icon-btn d-lg-none"
          id="menuBtn"
          type="button"
          aria-label="Menu"
        >
          <i class="bi bi-list"></i>
        </button>


        <div class="search-wrap">

          <i class="bi bi-search"></i>

          <input
            id="searchInput"
            type="search"
            placeholder="Pesquisar compromissos..."
          >

        </div>


        <div class="top-actions">

          <div class="user-chip">
            <div class="avatar">
              <i class="bi bi-person-fill"></i>
            </div>
            <span id="userNameDisplay">
              Usuário
            </span>
          </div>


          <button
            class="icon-btn"
            id="logoutBtn"
            type="button"
            title="Sair"
          >
            <i class="bi bi-box-arrow-right"></i>
          </button>

        </div>

      </header>


      <!-- CONTEÚDO -->

      <main
        id="main"
      ></main>

    </div>


    <!-- =================================================
         PAINEL LATERAL DE EVENTO
    ================================================== -->

    <aside
      class="panel"
      id="panel"
    >

      <div class="panel-head mb-4">

        <h2 id="formTitle" style="font-size: 18px; font-weight: 800; margin: 0;">
          Novo compromisso
        </h2>

        <button
          class="icon-btn"
          id="closeForm"
          type="button"
          style="width: 34px; height: 34px;"
        >
          <i class="bi bi-x-lg"></i>
        </button>

      </div>


      <form id="eventForm">

        <input
          type="hidden"
          id="eventId"
        >


        <label class="field-label">
          Título <span>*</span>
        </label>

        <input
          type="text"
          class="form-control mb-3"
          id="title"
          maxlength="100"
          placeholder="Ex.: Reunião importante"
          required
        >


        <div class="row g-2 mb-3">

          <div class="col-12">

            <label class="field-label">
              Data <span>*</span>
            </label>

            <input
              type="date"
              class="form-control"
              id="date"
              required
            >

          </div>


          <div class="col-6">

            <label class="field-label">
              Início <span>*</span>
            </label>

            <input
              type="time"
              class="form-control"
              id="start"
              value="09:00"
              required
            >

          </div>


          <div class="col-6">

            <label class="field-label">
              Fim <span>*</span>
            </label>

            <input
              type="time"
              class="form-control"
              id="end"
              value="10:00"
              required
            >

          </div>

        </div>


        <label class="field-label">
          Descrição (opcional)
        </label>

        <textarea
          class="form-control mb-3"
          id="description"
          rows="2"
          maxlength="240"
          placeholder="Adicione mais detalhes..."
        ></textarea>


        <label class="field-label">
          Cor do evento
        </label>

        <div
          class="swatches d-flex gap-2 mb-3"
          id="colorPicker"
        ></div>


        <label class="field-label">
          Categoria
        </label>

        <select
          class="form-select mb-3"
          id="category"
        >
          <option>Estudos</option>
          <option>Pessoal</option>
          <option>Trabalho</option>
          <option>Saúde</option>
          <option>Outros</option>
        </select>


        <p
          class="form-error"
          id="formError"
          hidden
        ></p>


        <div class="form-actions d-flex gap-2 mt-4">

          <button
            class="btn flex-grow-1"
            type="submit"
            id="saveBtn"
          >
            Salvar
          </button>

          <button
            class="secondary-button"
            type="button"
            id="cancelBtn"
          >
            Cancelar
          </button>

          <button
            class="danger-button d-none"
            type="button"
            id="deleteBtn"
          >
            Excluir
          </button>

        </div>

      </form>

    </aside>

  </div>


  <!-- BACKDROP PARA MOBILE -->
  <div class="backdrop" id="backdrop"></div>


  <!-- TOASTS -->

  <div
    class="toast-wrap"
    id="toasts"
  ></div>


  <!-- Bootstrap JS -->

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>


  <!-- JavaScript do projeto -->

  <script src="script.js"></script>

</body>
</html>
